<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q1 - Responsive Navbar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; }
  .navbar { display: flex; align-items: center; justify-content: space-between;
            background: #1f2937; color: #fff; padding: 12px 20px; position: relative; }
  .logo { font-size: 22px; font-weight: bold; color: #fbbf24; text-decoration: none; }
  .menu { display: flex; list-style: none; gap: 18px; }
  .menu a { color: #fff; text-decoration: none; padding: 6px 4px; }
  .menu a:hover { color: #fbbf24; }
  .search { padding: 7px 10px; border: none; border-radius: 4px; width: 180px; }
  .actions { display: flex; align-items: center; gap: 14px; }
  .cart { background: #fbbf24; color: #111; padding: 6px 12px; border-radius: 4px;
          font-weight: bold; text-decoration: none; }
  .toggle-box { display: none; }              /* hidden checkbox used for the hamburger */
  .hamburger { display: none; font-size: 28px; cursor: pointer; }

  /* Tablet: shrink search box and spacing */
  @media (max-width: 992px) {
    .search { width: 120px; }
    .menu { gap: 10px; }
  }
  /* Mobile: collapse links into a vertical dropdown */
  @media (max-width: 768px) {
    .hamburger { display: block; }
    .search, .actions .login { display: none; }
    .menu { display: none; flex-direction: column; position: absolute; top: 100%; left: 0;
            width: 100%; background: #374151; padding: 10px 20px; gap: 0; z-index: 10; }
    .menu li a { display: block; padding: 12px 0; border-bottom: 1px solid #4b5563; }
    .toggle-box:checked ~ .menu { display: flex; }
  }
</style>
</head>
<body>
<nav class="navbar">
  <a href="#" class="logo">ShopEasy</a>
  <input type="checkbox" id="toggle" class="toggle-box">
  <ul class="menu">
    <li><a href="#">Home</a></li>
    <li><a href="#">Shop</a></li>
    <li><a href="#">Categories</a></li>
    <li><a href="#">Deals</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
  <div class="actions">
    <input class="search" type="text" placeholder="Search products...">
    <a href="#" class="login" style="color:#fff">Login</a>
    <a href="#" class="cart">Cart (2)</a>
    <label for="toggle" class="hamburger">&#9776;</label>
  </div>
</nav>
<p style="padding:20px">Page content goes here...</p>
</body>
</html>
