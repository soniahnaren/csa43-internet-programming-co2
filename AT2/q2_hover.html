<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q2 - Product Hover Effect</title>
<style>
  body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 30px; }
  .grid { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; }
  .card { width: 230px; background: #fff; border-radius: 10px; overflow: hidden;
          box-shadow: 0 2px 6px rgba(0,0,0,0.15); position: relative;
          transition: transform 0.3s ease, box-shadow 0.3s ease; }
  .card:hover { transform: translateY(-10px); box-shadow: 0 14px 24px rgba(0,0,0,0.25); }
  .img-wrap { height: 170px; overflow: hidden; }
  .img { height: 100%; transition: transform 0.4s ease; }
  .card:hover .img { transform: scale(1.12); }
  .info { padding: 14px 14px 56px; }   /* room for the slide-up button */
  .price { color: #dc2626; font-weight: bold; }
  .btn { position: absolute; left: 0; right: 0; bottom: 0; background: #111827; color: #fff;
         text-align: center; padding: 12px; opacity: 0; transform: translateY(100%);
         transition: opacity 0.3s ease, transform 0.3s ease; }
  .card:hover .btn { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .card, .img, .btn { transition: none; } }
</style>
</head>
<body>
<h2 style="text-align:center;margin-bottom:25px">Featured Products</h2>
<div class="grid">
  <div class="card"><div class="img-wrap"><div class="img" style="background:linear-gradient(135deg,#60a5fa,#1d4ed8)"></div></div>
    <div class="info"><h3>Wireless Headphones</h3><p class="price">Rs. 2,499</p></div><div class="btn">Add to Cart</div></div>
  <div class="card"><div class="img-wrap"><div class="img" style="background:linear-gradient(135deg,#f9a8d4,#be185d)"></div></div>
    <div class="info"><h3>Smart Watch</h3><p class="price">Rs. 3,999</p></div><div class="btn">Add to Cart</div></div>
  <div class="card"><div class="img-wrap"><div class="img" style="background:linear-gradient(135deg,#86efac,#15803d)"></div></div>
    <div class="info"><h3>Bluetooth Speaker</h3><p class="price">Rs. 1,799</p></div><div class="btn">Add to Cart</div></div>
</div>
</body>
</html>
