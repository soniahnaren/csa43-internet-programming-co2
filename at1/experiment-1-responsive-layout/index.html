<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy - Responsive</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #333; }

.container {
  display: grid;
  grid-template-areas: "header" "nav" "main" "footer";
  min-height: 100vh;
}
header { grid-area: header; background: #2c3e50; color: #fff; padding: 16px 20px; }
nav    { grid-area: nav; background: #34495e; }
main   { grid-area: main; padding: 20px; }
footer { grid-area: footer; background: #2c3e50; color: #ccc; text-align: center; padding: 14px; }

nav ul { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; }
nav a  { display: block; color: #fff; text-decoration: none; padding: 12px 16px; }
nav a:hover { background: #1abc9c; }

.products {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}
.card {
  background: #fff;
  border-radius: 8px;
  padding: 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.card .img { height: 120px; background: #dfe6e9; border-radius: 6px; margin-bottom: 12px;
             display:flex; align-items:center; justify-content:center; color:#777; }
.card h3 { font-size: 16px; margin-bottom: 6px; }
.card .price { color: #e67e22; font-weight: bold; margin-bottom: 10px; }
.card button { padding: 8px; border: none; background: #1abc9c; color: #fff; border-radius: 4px; cursor: pointer; }

/* Tablet */
@media (min-width: 600px) {
  .products { grid-template-columns: repeat(2, 1fr); }
  header h1 { font-size: 26px; }
}

/* Desktop */
@media (min-width: 1024px) {
  .container {
    grid-template-columns: 200px 1fr;
    grid-template-areas: "header header" "nav main" "footer footer";
  }
  nav ul { flex-direction: column; }
  .products { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
<div class="container">
  <header><h1>ShopEasy</h1><p>Your one-stop online store</p></header>
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Men</a></li>
      <li><a href="#">Women</a></li>
      <li><a href="#">Kids</a></li>
      <li><a href="#">Offers</a></li>
    </ul>
  </nav>
  <main>
    <section class="products">
      <div class="card"><div class="img">Image</div><h3>Cotton T-Shirt</h3><p class="price">₹499</p><button>Add to Cart</button></div>
      <div class="card"><div class="img">Image</div><h3>Denim Jeans</h3><p class="price">₹1,299</p><button>Add to Cart</button></div>
      <div class="card"><div class="img">Image</div><h3>Running Shoes</h3><p class="price">₹2,499</p><button>Add to Cart</button></div>
      <div class="card"><div class="img">Image</div><h3>Kids Hoodie</h3><p class="price">₹799</p><button>Add to Cart</button></div>
      <div class="card"><div class="img">Image</div><h3>Leather Wallet</h3><p class="price">₹599</p><button>Add to Cart</button></div>
      <div class="card"><div class="img">Image</div><h3>Sunglasses</h3><p class="price">₹899</p><button>Add to Cart</button></div>
    </section>
  </main>
  <footer>© 2026 ShopEasy. All rights reserved.</footer>
</div>
</body>
</html>
